<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f172a">
  <title>Personal File Drop</title>
  <style>
    :root{color-scheme:light dark;--bg:#f4f7fb;--card:#fff;--ink:#0f172a;--muted:#64748b;--line:#dbe3ee;--accent:#2563eb;--accent2:#7c3aed}
    @media(prefers-color-scheme:dark){:root{--bg:#0b1120;--card:#111a2e;--ink:#f8fafc;--muted:#a5b4cc;--line:#263553}}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;background:radial-gradient(circle at 15% 0,#dbeafe 0,transparent 35%),var(--bg);font:15px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink)}
    @media(prefers-color-scheme:dark){body{background:radial-gradient(circle at 15% 0,#172554 0,transparent 35%),var(--bg)}}
    .shell{width:min(760px,100%);margin:auto;padding:18px 12px 28px}
    .frame-wrap{overflow:hidden;border:1px solid var(--line);border-radius:24px;background:var(--card);box-shadow:0 24px 70px #17255418}
    iframe{display:block;width:100%;height:calc(100vh - 72px);min-height:690px;border:0;background:var(--card)}
    .fallback{display:none;text-align:center;padding:50px 24px;color:var(--muted)}
    .fallback h1{color:var(--ink);font-size:25px;margin:0 0 8px}
    .fallback a{display:inline-block;margin-top:15px;color:#fff;background:linear-gradient(100deg,var(--accent),var(--accent2));border-radius:12px;padding:12px 18px;text-decoration:none;font-weight:800}
    footer{text-align:center;color:var(--muted);font-size:11px;padding-top:12px}
    @media(max-width:560px){.shell{padding:0}.frame-wrap{border-radius:0;border-left:0;border-right:0}iframe{height:100vh;min-height:760px}}
  </style>
</head>
<body>
  <main class="shell">
    <section class="frame-wrap">
      <iframe id="dropFrame" title="Personal File Drop" loading="eager" allow="clipboard-write"></iframe>
      <div class="fallback" id="fallback">
        <h1>Open the file drop</h1>
        <p>The embedded upload form could not be displayed in this browser.</p>
        <a id="fallbackLink" target="_blank" rel="noopener">Open upload page</a>
      </div>
    </section>
    <footer>Powered by Google Drive</footer>
  </main>
  <script>
    /*
     * Replace this value with the deployed Apps Script Web App URL ending in /exec.
     * Example: https://script.google.com/macros/s/DEPLOYMENT_ID/exec
     */
    const APP_URL = 'https://script.google.com/macros/s/AKfycbx3_Dr3sAh2FGeJlQGB87T39j6-qGjGA7rK3ExkXB1y4cKWaW3JYQ8tPuVOXSGVOa3x/exec';
    const frame = document.getElementById('dropFrame');
    const fallback = document.getElementById('fallback');
    const fallbackLink = document.getElementById('fallbackLink');

    if (!APP_URL.includes('PASTE_YOUR_')) {
      frame.src = APP_URL;
      fallbackLink.href = APP_URL;
      setTimeout(() => {
        if (!frame.contentWindow) {
          frame.style.display = 'none';
          fallback.style.display = 'block';
        }
      }, 5000);
    } else {
      frame.style.display = 'none';
      fallback.style.display = 'block';
      fallback.querySelector('p').textContent = 'Add your Apps Script Web App URL in this file first.';
    }
  </script>
</body>
</html>
